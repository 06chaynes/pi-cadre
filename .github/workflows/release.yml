name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - npm

# Default to least-privilege. Only the npm publish job opts into id-token: write
# for npm trusted publishing (OIDC).
permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify tag matches package.json version
        # A manual run that targets npm must be dispatched from the release tag.
        if: github.event_name == 'push' || inputs.target == 'npm'
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${GIT_TAG#v}" ]; then
            echo "::error::tag $GIT_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Test extension
        run: npm test
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: "*.tgz"

  publish-dry-run:
    name: Publish dry run
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'dry-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - run: npm publish --dry-run --access public ./*.tgz

  publish-npm:
    name: Publish to npm
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'npm')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/pi-cadre
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish via trusted publishing (OIDC)
        # npm 11.5.1+ exchanges the GitHub OIDC token for a short-lived publish token; no NPM_TOKEN secret.
        run: npm publish --access public ./*.tgz
